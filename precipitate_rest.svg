<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep water gradient - darkest at bottom -->
  <defs>
    <linearGradient id="waterDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c8f;stop-opacity:0.3" />
      <stop offset="40%" style="stop-color:#2d5a6b;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#1a3d4d;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0d1f2b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8ab5c9;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Water body -->
  <rect width="800" height="600" fill="url(#waterDepth)"/>
  
  <!-- Particles slowly precipitating - upper water -->
  <circle cx="120" cy="80" r="2" fill="#b8d4e0" opacity="0.4">
    <animate attributeName="cy" values="80;140;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="100" r="1.5" fill="#b8d4e0" opacity="0.3">
    <animate attributeName="cy" values="100;180;100" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="60" r="2.5" fill="#b8d4e0" opacity="0.35">
    <animate attributeName="cy" values="60;150;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.55;0.35" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="120" r="1.8" fill="#b8d4e0" opacity="0.4">
    <animate attributeName="cy" values="120;200;120" dur="11s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mid-depth particles - slower descent -->
  <circle cx="200" cy="220" r="2.5" fill="#9ab8c7" opacity="0.5">
    <animate attributeName="cy" values="220;300;220" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="240" r="2" fill="#9ab8c7" opacity="0.45">
    <animate attributeName="cy" values="240;330;240" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="260" r="2.2" fill="#9ab8c7" opacity="0.5">
    <animate attributeName="cy" values="260;350;260" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="280" r="1.7" fill="#9ab8c7" opacity="0.4">
    <animate attributeName="cy" values="280;360;280" dur="13s" repeatCount="indefinite"/>
  </circle>
  
  <!-- The dark quiet bottom -->
  <ellipse cx="400" cy="520" rx="350" ry="60" fill="#08151c" opacity="0.7"/>
  
  <!-- Settled particles at the bottom - creating form -->
  <g opacity="0.7" filter="url(#glow)">
    <!-- Clusters forming -->
    <circle cx="280" cy="510" r="3" fill="#6b99ad"/>
    <circle cx="285" cy="513" r="2.5" fill="#6b99ad"/>
    <circle cx="275" cy="514" r="2.8" fill="#6b99ad"/>
    <circle cx="290" cy="508" r="2.2" fill="#6b99ad"/>
    
    <circle cx="520" cy="515" r="3.5" fill="#6b99ad"/>
    <circle cx="526" cy="518" r="2.8" fill="#6b99ad"/>
    <circle cx="515" cy="519" r="2.5" fill="#6b99ad"/>
    <circle cx="530" cy="513" r="2" fill="#6b99ad"/>
    <circle cx="518" cy="512" r="2.3" fill="#6b99ad"/>
    
    <circle cx="400" cy="520" r="4" fill="#6b99ad"/>
    <circle cx="407" cy="523" r="3.2" fill="#6b99ad"/>
    <circle cx="393" cy="524" r="3.5" fill="#6b99ad"/>
    <circle cx="405" cy="517" r="2.5" fill="#6b99ad"/>
    <circle cx="395" cy="516" r="2.8" fill="#6b99ad"/>
    <circle cx="412" cy="520" r="2" fill="#6b99ad"/>
    
    <circle cx="150" cy="512" r="2.5" fill="#6b99ad"/>
    <circle cx="155" cy="515" r="2.2" fill="#6b99ad"/>
    <circle cx="145" cy="516" r="2.7" fill="#6b99ad"/>
    
    <circle cx="640" cy="518" r="3" fill="#6b99ad"/>
    <circle cx="646" cy="521" r="2.5" fill="#6b99ad"/>
    <circle cx="635" cy="522" r="2.8" fill="#6b99ad"/>
  </g>
  
  <!-- Slow-falling particles approaching the bottom -->
  <circle cx="300" cy="420" r="2.5" fill="#7fa8ba" opacity="0.6">
    <animate attributeName="cy" values="420;510;420" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="400" r="2.2" fill="#7fa8ba" opacity="0.55">
    <animate attributeName="cy" values="400;515;400" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.75;0.55" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="430" r="2.8" fill="#7fa8ba" opacity="0.6">
    <animate attributeName="cy" values="430;518;430" dur="21s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="410" r="2" fill="#7fa8ba" opacity="0.5">
    <animate attributeName="cy" values="410;512;410" dur="19s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gentle light rays from above - barely reaching the depths -->
  <polygon points="100,0 110,600 90,600" fill="#ffffff" opacity="0.02"/>
  <polygon points="400,0 410,600 390,600" fill="#ffffff" opacity="0.03"/>
  <polygon points="650,0 660,600 640,600" fill="#ffffff" opacity="0.02"/>
  
  <!-- Very subtle ripples on the bottom suggesting gentle settling -->
  <ellipse cx="400" cy="530" rx="380" ry="50" fill="none" stroke="#4a7c8f" stroke-width="0.5" opacity="0.2">
    <animate attributeName="rx" values="380;400;380" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.15;0.2" dur="25s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="535" rx="360" ry="45" fill="none" stroke="#4a7c8f" stroke-width="0.5" opacity="0.15">
    <animate attributeName="rx" values="360;380;360" dur="28s" repeatCount="indefinite"/>
  </ellipse>
</svg>
